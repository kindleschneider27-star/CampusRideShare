<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text="'Campus Rides :: ' + ${pageTitle ?: 'Home'}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>
<div th:fragment="header-nav">
    <header><h1>Campus Rides</h1></header>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/list}">Rides</a>
        <a th:href="@{/register}">Register a Ride</a>
        <a th:href="@{/user/register}">Sign Up</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
        <form sec:authorize="isAuthenticated()" method="POST" th:action="@{/logout}">
            <input type="submit" value="Logout">
        </form>
    </nav>
    <div class="Welcome" sec:authorize="isAuthenticated()">
        Welcome <span sec:authentication="principal.fullName">FULLNAME</span>
    </div>
</div>

<footer th:fragment="footer">
    &copy; Campus Rides 2024<br>
</footer>
</body>
</html>
