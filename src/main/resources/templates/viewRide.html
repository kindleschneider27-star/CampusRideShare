<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head}"></head>
<body id="pageCenter">
<div th:replace="~{fragments :: header-nav}" ></div>
<main>
    <div class="errorMessage" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">
        Error Message
    </div>
    <div class="successMessage" role="status" th:if="${successMessage}" th:text="${successMessage}">
        Success Message
    </div>
    <h2 th:text="${current.driver.fullName}">DRIVER</h2>
    <p>Rider Limit: <span th:text="${current.riderLimit}">RIDER_LIMIT</span></p>
    <p>Current Passengers: <span th:text="${#lists.size(current.passengers)}">PASSENGERS</span></p>
    <p>Destination: <span th:text="${current.destination}">DESTINATION</span></p>
    <p>Departure: <span th:text="${current.departure}">DEPARTURE</span></p>
    <p>Date/Time: <span th:text="${#temporals.format(current.departureDate, 'MMM d, yyy h:mm a')}">DEPARTURE_DATE</span></p>
    <p>Department: <span th:text="${current.driver.department}">Department</span> </p>
    <p>Status: <span th:text="${current.status}">STATUS</span> </p>
    <a th:href="@{/rides/list}">Back to Rides</a>

</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
